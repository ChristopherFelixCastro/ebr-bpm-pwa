services:
  postgres:
    image: postgres:16-alpine
    container_name: ebr-bpm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebr_bpm}
      POSTGRES_USER: ${POSTGRES_USER:-ebr_bpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["${POSTGRES_PORT:-54329}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
